{% extends "incidents/layout.html" %}

{% block body %}

<h1>My Incidents</h1>

{% for incident in incidents %}

<div class="card p-3 mb-3">

    <h4>
        <a href="{% url 'incidents:incident' incident.id %}">
            {{ incident.title }}
        </a>
    </h4>

    <p>{{ incident.location }}</p>

    <span class="badge bg-secondary">
        {{ incident.status }}
    </span>

</div>

{% empty %}

<p>You have not reported any incidents yet.</p>

{% endfor %}

{% endblock %}
