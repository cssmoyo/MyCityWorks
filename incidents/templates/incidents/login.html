{% extends "incidents/layout.html" %}

{% block body %}

<h2>Login</h2>

{% if message %}
<div class="alert alert-danger">
    {{ message }}
</div>
{% endif %}

<form method="post">
    {% csrf_token %}

    <input class="form-control mb-3"
           name="username"
           placeholder="Username">

    <input class="form-control mb-3"
           name="password"
           type="password"
           placeholder="Password">

    <button class="btn btn-primary">
        Login
    </button>

</form>

{% endblock %}
