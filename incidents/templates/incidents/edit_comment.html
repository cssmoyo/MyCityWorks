{% extends "incidents/layout.html" %}

{% block body %}

<h2>Edit Comment</h2>

<form method="post">
    {% csrf_token %}

    <textarea
        name="content"
        class="form-control"
        rows="4">{{ comment.content }}</textarea>

    <br>

    <button type="submit"
            class="btn btn-primary">
        Save Changes
    </button>

    <a href="{% url 'incidents:incident' comment.incident.id %}"
       class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
